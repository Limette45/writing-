<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Practice</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  width: 100%;
  padding: 10px;
  background: #fff;
  border-bottom: 1px solid #ddd;
}

.header-inner {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.language-controls,
.page-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}

button {
  min-height: 42px;
  padding: 10px 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: #fff;
  color: #222;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #f0f0f0;
}

button.active {
  background: #222;
  color: #fff;
  border-color: #222;
}

.language-controls button {
  flex: 1 1 100px;
  max-width: 150px;
}

.page-controls button {
  flex: 0 1 140px;
}

main {
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
  padding: 24px 16px 40px;
}

.hidden {
  display: none !important;
}

.sentence-box {
  width: 100%;
  min-height: 220px;
  padding: 28px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 12px;
  overflow-wrap: anywhere;
}

.english {
  width: 100%;
  font-size: 23px;
  line-height: 1.6;
  text-align: center;
  cursor: pointer;
}

.answer {
  display: none;
  width: 100%;
  font-size: 21px;
  line-height: 1.6;
  text-align: center;
  cursor: pointer;
}

.answer.show {
  display: block;
}

.actions {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.actions button {
  min-width: 120px;
}

textarea {
  display: block;
  width: 100%;
  min-height: 400px;
  padding: 14px;
  resize: vertical;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-family: monospace;
  font-size: 15px;
  line-height: 1.6;
}

h2 {
  margin: 0 0 18px;
}

.inventory-item {
  margin-bottom: 12px;
  padding: 16px;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 10px;
  overflow-wrap: anywhere;
}

.inventory-item pre {
  margin: 0 0 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: Arial, sans-serif;
  font-size: 15px;
  line-height: 1.7;
}

.remove-btn {
  color: #b00020;
}

.status {
  margin-top: 14px;
  text-align: center;
  color: #666;
}

#inventoryList {
  margin-top: 20px;
}

@media (max-width: 500px) {
  .language-controls,
  .page-controls {
    gap: 6px;
  }

  .language-controls button {
    flex: 1 1 calc(50% - 6px);
    max-width: none;
    padding: 9px 8px;
    font-size: 14px;
  }

  .page-controls button {
    flex: 1 1 0;
  }

  main {
    padding: 18px 12px 30px;
  }

  .sentence-box {
    min-height: 200px;
    padding: 24px 16px;
    gap: 20px;
  }

  .english {
    font-size: 20px;
  }

  .answer {
    font-size: 19px;
  }

  .actions {
    gap: 8px;
  }

  .actions button {
    flex: 1 1 130px;
  }

  textarea {
    min-height: 350px;
    font-size: 14px;
  }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="language-controls">
      <button class="lang-btn active" data-lang="esp">🇪🇸Español</button>
      <button class="lang-btn" data-lang="deu">🇩🇪Deutsch</button>
      <button class="lang-btn" data-lang="sve">🇸🇪Svenska</button>
      <button class="lang-btn" data-lang="fra">🇫🇷Français</button>
    </div>
    <div class="page-controls">
      <button id="inventoryBtn">Inventory</button>
      <button id="loadBtn">Load</button>
    </div>
  </div>
</header>

<main>
  <section id="mainPage">
    <div class="sentence-box">
      <div id="englishSentence" class="english"></div>
      <div id="answerSentence" class="answer"></div>
    </div>

    <div class="actions">
      <button id="showAnswerBtn">Show Answer</button>
      <button id="nextBtn">Next</button>
    </div>

    <div id="mainStatus" class="status"></div>
  </section>

  <section id="loadPage" class="hidden">
    <h2>Load Sentences</h2>

    <textarea id="loadInput" placeholder="[eng]
This one is the same as this.
Das hier ist dasselbe wie das hier.
Esto es lo mismo que esto.
C'est la même chose que ça.
Det här är samma sak som det här.

[eng]
This is the coolest thing I've ever done.
Das ist das Coolste, was ich je gemacht habe.
Esto es lo más genial que he hecho.
C'est la chose la plus cool que j'aie jamais faite.
Det här är det coolaste jag någonsin har gjort."></textarea>

    <div class="actions">
      <button id="saveBtn">Load &amp; Save</button>
      <button id="backFromLoadBtn">Back</button>
    </div>

    <div id="loadStatus" class="status"></div>
  </section>

  <section id="inventoryPage" class="hidden">
    <h2>Inventory</h2>

    <div class="actions" style="justify-content:flex-start; margin-top:0;">
      <button id="copyAllBtn">Copy All</button>
      <button id="backFromInventoryBtn">Back</button>
    </div>

    <div id="inventoryList"></div>
  </section>
</main>

<script>
"use strict";

const STORAGE_KEY = "sentenceWritingPracticeInventory_v1_7f39c2a8";
const languages = ["eng", "deu", "esp", "fra", "sve"];

let inventory = [];
let currentLanguage = "esp";
let currentItem = null;

const mainPage = document.getElementById("mainPage");
const loadPage = document.getElementById("loadPage");
const inventoryPage = document.getElementById("inventoryPage");

const englishSentence = document.getElementById("englishSentence");
const answerSentence = document.getElementById("answerSentence");

const showAnswerBtn = document.getElementById("showAnswerBtn");
const nextBtn = document.getElementById("nextBtn");
const inventoryBtn = document.getElementById("inventoryBtn");
const loadBtn = document.getElementById("loadBtn");

const loadInput = document.getElementById("loadInput");
const saveBtn = document.getElementById("saveBtn");

const inventoryList = document.getElementById("inventoryList");
const copyAllBtn = document.getElementById("copyAllBtn");

const mainStatus = document.getElementById("mainStatus");
const loadStatus = document.getElementById("loadStatus");

function loadStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    const parsed = saved ? JSON.parse(saved) : [];

    inventory = Array.isArray(parsed)
      ? parsed.filter(item =>
          item &&
          typeof item === "object" &&
          typeof item.eng === "string"
        ).map(item => ({
          eng: item.eng,
          deu: typeof item.deu === "string" ? item.deu : "",
          esp: typeof item.esp === "string" ? item.esp : "",
          fra: typeof item.fra === "string" ? item.fra : "",
          sve: typeof item.sve === "string" ? item.sve : ""
        }))
      : [];
  } catch {
    inventory = [];
  }
}

function saveStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
    return true;
  } catch {
    return false;
  }
}

function parseInput(text) {
  const lines = text
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(line => line.length > 0);

  const result = [];
  let current = null;

  for (const line of lines) {
    const match = line.match(/^\[([a-zA-Z]+)\]$/);

    if (match) {
      if (current && current.eng) {
        result.push(current);
      }

      current = {
        eng: "",
        deu: "",
        esp: "",
        fra: "",
        sve: ""
      };

      continue;
    }

    if (!current) continue;

    const missingLanguage = languages.find(lang => !current[lang]);

    if (missingLanguage) {
      current[missingLanguage] = line;
    }
  }

  if (current && current.eng) {
    result.push(current);
  }

  return result;
}

function randomItem() {
  mainStatus.textContent = "";

  if (inventory.length === 0) {
    currentItem = null;
    englishSentence.textContent = "No sentences loaded.";
    answerSentence.textContent = "";
    answerSentence.classList.remove("show");
    return;
  }

  const index = Math.floor(Math.random() * inventory.length);
  currentItem = inventory[index];

  englishSentence.textContent = currentItem.eng;
  answerSentence.textContent =
    currentItem[currentLanguage] || "(No translation)";
  answerSentence.classList.remove("show");
}

function updateLanguageButtons() {
  document.querySelectorAll(".lang-btn").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.lang === currentLanguage
    );
  });
}

function switchLanguage(lang) {
  if (!languages.includes(lang) || lang === "eng") return;

  currentLanguage = lang;
  updateLanguageButtons();

  if (currentItem) {
    answerSentence.textContent =
      currentItem[currentLanguage] || "(No translation)";
  }
}

function speak(text, lang) {
  if (!text || !("speechSynthesis" in window)) return;

  try {
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);

    const prefixes = {
      eng: ["en-US", "en-GB", "en"],
      deu: ["de-DE", "de"],
      esp: ["es-ES", "es-MX", "es-US", "es"],
      fra: ["fr-FR", "fr-CA", "fr"],
      sve: ["sv-SE", "sv"]
    };

    const preferred = prefixes[lang] || [];
    const voices = window.speechSynthesis.getVoices();

    const voice = voices.find(v =>
      preferred.some(prefix =>
        v.lang.toLowerCase() === prefix.toLowerCase()
      )
    ) || voices.find(v =>
      preferred.some(prefix =>
        v.lang.toLowerCase().startsWith(prefix.toLowerCase())
      )
    );

    if (voice) {
      utterance.voice = voice;
      utterance.lang = voice.lang;
    } else {
      utterance.lang = preferred[0] || "en-US";
    }

    window.speechSynthesis.speak(utterance);
  } catch {
    mainStatus.textContent = "Speech playback is unavailable.";
  }
}

function showPage(page) {
  mainPage.classList.add("hidden");
  loadPage.classList.add("hidden");
  inventoryPage.classList.add("hidden");

  page.classList.remove("hidden");

  if (page === inventoryPage) {
    renderInventory();
  }

  window.scrollTo(0, 0);
}

function renderInventory() {
  inventoryList.replaceChildren();

  if (inventory.length === 0) {
    inventoryList.textContent = "No sentences saved.";
    return;
  }

  inventory.forEach((item, index) => {
    const wrapper = document.createElement("div");
    wrapper.className = "inventory-item";

    const pre = document.createElement("pre");
    pre.textContent =
      "[eng]\n" +
      item.eng + "\n" +
      item.deu + "\n" +
      item.esp + "\n" +
      item.fra + "\n" +
      item.sve;

    const removeButton = document.createElement("button");
    removeButton.className = "remove-btn";
    removeButton.textContent = "Remove";

    removeButton.addEventListener("click", () => {
      if (!window.confirm("Are you sure you want to remove this sentence?")) {
        return;
      }

      const removedItem = inventory[index];
      inventory.splice(index, 1);

      if (!saveStorage()) {
        inventory.splice(index, 0, removedItem);
        renderInventory();
        loadStatus.textContent = "Unable to save changes.";
        return;
      }

      if (currentItem === item) {
        currentItem = null;
        randomItem();
      }

      renderInventory();
    });

    wrapper.appendChild(pre);
    wrapper.appendChild(removeButton);
    inventoryList.appendChild(wrapper);
  });
}

function getAllAsText() {
  return inventory.map(item =>
    "[eng]\n" +
    item.eng + "\n" +
    item.deu + "\n" +
    item.esp + "\n" +
    item.fra + "\n" +
    item.sve
  ).join("\n\n");
}

document.querySelectorAll(".lang-btn").forEach(button => {
  button.addEventListener("click", () => {
    switchLanguage(button.dataset.lang);
  });
});

showAnswerBtn.addEventListener("click", () => {
  if (!currentItem) return;

  answerSentence.classList.toggle("show");

  if (answerSentence.classList.contains("show")) {
    answerSentence.textContent =
      currentItem[currentLanguage] || "(No translation)";
  }
});

nextBtn.addEventListener("click", randomItem);

englishSentence.addEventListener("click", () => {
  if (currentItem) speak(currentItem.eng, "eng");
});

answerSentence.addEventListener("click", () => {
  if (currentItem && answerSentence.classList.contains("show")) {
    speak(currentItem[currentLanguage], currentLanguage);
  }
});

inventoryBtn.addEventListener("click", () => {
  showPage(inventoryPage);
});

loadBtn.addEventListener("click", () => {
  loadStatus.textContent = "";
  showPage(loadPage);
});

document.getElementById("backFromLoadBtn").addEventListener("click", () => {
  showPage(mainPage);
});

document.getElementById("backFromInventoryBtn").addEventListener("click", () => {
  showPage(mainPage);
});

saveBtn.addEventListener("click", () => {
  const parsed = parseInput(loadInput.value);

  if (parsed.length === 0) {
    loadStatus.textContent = "No valid sentence sets found.";
    return;
  }

  inventory.push(...parsed);

  if (!saveStorage()) {
    inventory.splice(inventory.length - parsed.length, parsed.length);
    loadStatus.textContent = "Unable to save. Storage may be unavailable or full.";
    return;
  }

  loadStatus.textContent =
    `${parsed.length} sentence set${parsed.length === 1 ? "" : "s"} loaded.`;

  loadInput.value = "";
});

copyAllBtn.addEventListener("click", async () => {
  const text = getAllAsText();

  if (!text) return;

  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const temp = document.createElement("textarea");
    temp.value = text;
    temp.style.position = "fixed";
    temp.style.opacity = "0";
    document.body.appendChild(temp);
    temp.select();

    const copied = document.execCommand("copy");
    temp.remove();

    if (!copied) {
      copyAllBtn.textContent = "Copy failed";
      return;
    }
  }

  copyAllBtn.textContent = "Copied";

  window.setTimeout(() => {
    copyAllBtn.textContent = "Copy All";
  }, 1200);
});

loadStorage();
updateLanguageButtons();
randomItem();
</script>

</body>
</html>
