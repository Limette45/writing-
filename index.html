<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Practice</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 16px;
    background: #f5f5f5;
    color: #222;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  h1 {
    font-size: 24px;
    margin: 0 0 20px;
  }

  button {
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
    color: #222;
    padding: 10px 14px;
    font-size: 15px;
    touch-action: manipulation;
  }

  button:hover {
    background: #f0f0f0;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .language-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }

  .language-btn.active {
    background: #dff6ff;
    border-color: #79c9e8;
    font-weight: bold;
  }

  .page {
    display: none;
  }

  .page.active {
    display: block;
  }

  .english-text {
    font-size: 22px;
    line-height: 1.6;
    margin: 20px 0;
    overflow-wrap: anywhere;
  }

  .answer-text {
    font-size: 20px;
    line-height: 1.7;
    margin: 20px 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .answer-text.hidden {
    display: none;
  }

  .primary-btn {
    background: #e5f5ff;
    border-color: #8acbed;
    font-weight: bold;
  }

  .primary-btn:hover {
    background: #d4edfc;
  }

  #showAnswerBtn {
    min-height: 58px;
    min-width: 160px;
    padding: 14px 24px;
    font-size: 17px;
  }

  .action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-top: 20px;
  }

  .typing-area {
    width: 100%;
    min-height: 140px;
    resize: vertical;
    padding: 12px;
    border: 1px solid #bbb;
    border-radius: 8px;
    font: inherit;
    font-size: 17px;
    line-height: 1.6;
  }

  .typing-area:focus {
    outline: 2px solid #8acbed;
    border-color: #8acbed;
  }

  .mode-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 50px;
    padding-top: 18px;
    border-top: 1px solid #ddd;
  }

  .mode-btn.active {
    background: #e8e8e8;
    border-color: #888;
    font-weight: bold;
  }

  .status {
    margin-top: 16px;
    color: #666;
    font-size: 14px;
  }

  .bottom-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 36px;
    padding-top: 16px;
    border-top: 1px solid #ddd;
  }

  .inventory-title {
    font-size: 21px;
    margin-bottom: 16px;
  }

  .inventory-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .inventory-item {
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    overflow-wrap: anywhere;
  }

  .inventory-item p {
    margin: 0 0 8px;
    line-height: 1.5;
  }

  .inventory-item p:last-child {
    margin-bottom: 0;
  }

  .inventory-empty {
    color: #777;
    margin-top: 20px;
  }

  .load-area {
    width: 100%;
    min-height: 240px;
    padding: 12px;
    border: 1px solid #bbb;
    border-radius: 8px;
    font: inherit;
    font-size: 15px;
    line-height: 1.6;
  }

  .load-help {
    font-size: 14px;
    color: #666;
    line-height: 1.6;
    margin: 12px 0;
  }

  .hidden {
    display: none !important;
  }

  @media (max-width: 600px) {
    body {
      padding: 10px;
    }

    .container {
      padding: 16px;
    }

    h1 {
      font-size: 22px;
    }

    .english-text {
      font-size: 20px;
    }

    .answer-text {
      font-size: 18px;
    }

    #showAnswerBtn {
      min-height: 64px;
      min-width: 180px;
      padding: 16px 24px;
      font-size: 18px;
    }

    .mode-controls {
      margin-top: 56px;
    }

    .action-row {
      gap: 10px;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Writing Practice</h1>

  <div class="language-controls" id="languageControls">
    <button class="language-btn active" data-lang="deu">🇩🇪German</button>
    <button class="language-btn" data-lang="esp">🇪🇸Spanish</button>
    <button class="language-btn" data-lang="fra">🇫🇷French</button>
    <button class="language-btn" data-lang="sve">🇸🇪Swedish</button>
  </div>

  <main id="mainPage" class="page active">
    <div id="studyContent">
      <div class="english-text" id="englishText">Load sentences to begin.</div>

      <div id="typingSection" class="hidden">
        <textarea
          id="typingInput"
          class="typing-area"
          placeholder="Type your translation here..."
        ></textarea>
      </div>

      <div id="answerText" class="answer-text hidden"></div>

      <div class="action-row">
        <button id="showAnswerBtn" class="primary-btn">✨ Show Answer</button>
      </div>
    </div>

    <div class="mode-controls">
      <button id="viewModeBtn" class="mode-btn active">View Mode</button>
      <button id="typingModeBtn" class="mode-btn">Typing Mode</button>
    </div>

    <div class="status" id="statusText">No sentences loaded.</div>

    <div class="bottom-controls">
      <button id="inventoryBtn">Inventory</button>
      <button id="loadBtn">Load</button>
    </div>
  </main>

  <section id="inventoryPage" class="page">
    <div class="inventory-title">Inventory</div>
    <div class="inventory-actions">
      <button id="copyAllBtn">Copy All</button>
      <button id="backFromInventoryBtn">Back</button>
    </div>
    <div id="inventoryList"></div>
  </section>

  <section id="loadPage" class="page">
    <div class="inventory-title">Load Sentences</div>
    <p class="load-help">
      Enter sentences in the following format. Each block starts with [eng],
      followed by English, German, Spanish, French, and Swedish translations,
      one per line.
    </p>
    <textarea
      id="loadInput"
      class="load-area"
      placeholder="[eng]
English sentence
German translation
Spanish translation
French translation
Swedish translation"
    ></textarea>
    <div class="action-row">
      <button id="importBtn" class="primary-btn">Import</button>
      <button id="backFromLoadBtn">Back</button>
    </div>
    <div class="status" id="loadStatus"></div>
  </section>
</div>

<script>
(() => {
  const STORAGE_KEY = "sentenceWritingPracticeInventory_v1_7f39c2a8";

  const languageNames = {
    deu: "German",
    esp: "Spanish",
    fra: "French",
    sve: "Swedish"
  };

  const languageCodes = {
    deu: ["de-DE"],
    esp: ["es-MX", "es-419", "es-US", "es"],
    fra: ["fr-FR"],
    sve: ["sv-SE"]
  };

  let inventory = [];
  let currentIndex = 0;
  let selectedLanguage = "deu";
  let mode = "view";
  let answerVisible = false;
  let typingAnswerVisible = false;
  let currentPage = "main";

  const $ = id => document.getElementById(id);

  const englishText = $("englishText");
  const answerText = $("answerText");
  const typingInput = $("typingInput");
  const showAnswerBtn = $("showAnswerBtn");
  const statusText = $("statusText");
  const typingSection = $("typingSection");

  function loadInventory() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      inventory = stored ? JSON.parse(stored) : [];
      if (!Array.isArray(inventory)) inventory = [];
    } catch {
      inventory = [];
    }
  }

  function saveInventory() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
  }

  function showPage(pageName) {
    currentPage = pageName;

    $("mainPage").classList.toggle("active", pageName === "main");
    $("inventoryPage").classList.toggle("active", pageName === "inventory");
    $("loadPage").classList.toggle("active", pageName === "load");

    if (pageName === "inventory") renderInventory();
  }

  function getTranslation(item, lang = selectedLanguage) {
    if (!item) return "";
    return item[lang] || "";
  }

  function speak(text, lang) {
    if (!text || !("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    const preferredCodes = languageCodes[lang] || [];

    const voices = window.speechSynthesis.getVoices();
    let voice = null;

    for (const code of preferredCodes) {
      voice = voices.find(v => v.lang.toLowerCase() === code.toLowerCase());
      if (voice) break;
    }

    if (!voice && lang === "esp") {
      voice = voices.find(v => /^es-(MX|419|US)/i.test(v.lang));
    }

    if (!voice) {
      const prefix = {
        deu: "de",
        esp: "es",
        fra: "fr",
        sve: "sv"
      }[lang];

      voice = voices.find(v => v.lang.toLowerCase().startsWith(prefix));
    }

    if (voice) utterance.voice = voice;
    utterance.lang = voice ? voice.lang : (preferredCodes[0] || "en-US");
    window.speechSynthesis.speak(utterance);
  }

  function renderStudy() {
    const item = inventory[currentIndex];

    if (!item) {
      englishText.textContent = "No sentences loaded. Select Load to import sentences.";
      answerText.textContent = "";
      answerText.classList.add("hidden");
      typingInput.value = "";
      showAnswerBtn.textContent = "✨ Show Answer";
      showAnswerBtn.disabled = true;
      statusText.textContent = "No sentences loaded.";
      return;
    }

    showAnswerBtn.disabled = false;
    englishText.textContent = item.eng || "";
    answerText.textContent = getTranslation(item);
    typingInput.value = "";

    answerVisible = false;
    typingAnswerVisible = false;
    answerText.classList.add("hidden");

    if (mode === "view") {
      typingSection.classList.add("hidden");
      englishText.classList.remove("hidden");
      showAnswerBtn.textContent = "✨ Show Answer";
    } else {
      typingSection.classList.remove("hidden");
      englishText.classList.remove("hidden");
      showAnswerBtn.textContent = "✨ Show Answer";
    }

    statusText.textContent =
      `Sentence ${currentIndex + 1} of ${inventory.length} · ${languageNames[selectedLanguage]}`;
  }

  function showAnswer() {
    const item = inventory[currentIndex];
    if (!item) return;

    if (mode === "view") {
      if (!answerVisible) {
        answerVisible = true;
        answerText.classList.remove("hidden");
        showAnswerBtn.textContent = "✨ Next";
        speak(getTranslation(item), selectedLanguage);
      } else {
        nextSentence();
      }
    } else {
      if (!typingAnswerVisible) {
        typingAnswerVisible = true;
        answerText.classList.remove("hidden");
        showAnswerBtn.textContent = "✨ Next";
        speak(getTranslation(item), selectedLanguage);
      } else {
        nextSentence();
      }
    }
  }

  function nextSentence() {
    if (!inventory.length) return;

    currentIndex = (currentIndex + 1) % inventory.length;
    renderStudy();
  }

  function setMode(newMode) {
    mode = newMode;

    $("viewModeBtn").classList.toggle("active", mode === "view");
    $("typingModeBtn").classList.toggle("active", mode === "typing");

    renderStudy();
  }

  function setLanguage(lang) {
    selectedLanguage = lang;

    document.querySelectorAll(".language-btn").forEach(button => {
      button.classList.toggle("active", button.dataset.lang === lang);
    });

    renderStudy();
  }

  function parseInput(rawText) {
    const lines = rawText.replace(/\r/g, "").split("\n");
    const blocks = [];
    let currentBlock = [];

    for (const line of lines) {
      if (line.trim().toLowerCase() === "[eng]") {
        if (currentBlock.length) blocks.push(currentBlock);
        currentBlock = [];
      } else if (currentBlock.length || line.trim()) {
        currentBlock.push(line.trim());
      }
    }

    if (currentBlock.length) blocks.push(currentBlock);

    return blocks
      .filter(block => block.some(line => line))
      .map(block => ({
        eng: block[0] || "",
        deu: block[1] || "",
        esp: block[2] || "",
        fra: block[3] || "",
        sve: block[4] || ""
      }))
      .filter(item => item.eng);
  }

  function renderInventory() {
    const list = $("inventoryList");
    list.innerHTML = "";

    if (!inventory.length) {
      const empty = document.createElement("p");
      empty.className = "inventory-empty";
      empty.textContent = "Inventory is empty.";
      list.appendChild(empty);
      return;
    }

    inventory.forEach((item, index) => {
      const wrapper = document.createElement("div");
      wrapper.className = "inventory-item";

      const languages = [
        ["English", item.eng],
        ["German", item.deu],
        ["Spanish", item.esp],
        ["French", item.fra],
        ["Swedish", item.sve]
      ];

      languages.forEach(([label, value]) => {
        if (!value) return;
        const p = document.createElement("p");
        const strong = document.createElement("strong");
        strong.textContent = `${label}: `;
        p.appendChild(strong);
        p.appendChild(document.createTextNode(value));
        wrapper.appendChild(p);
      });

      const removeBtn = document.createElement("button");
      removeBtn.textContent = "Remove";
      removeBtn.addEventListener("click", () => {
        inventory.splice(index, 1);
        saveInventory();

        if (currentIndex >= inventory.length) {
          currentIndex = Math.max(0, inventory.length - 1);
        }

        renderInventory();
        renderStudy();
      });

      wrapper.appendChild(removeBtn);
      list.appendChild(wrapper);
    });
  }

  document.querySelectorAll(".language-btn").forEach(button => {
    button.addEventListener("click", () => setLanguage(button.dataset.lang));
  });

  showAnswerBtn.addEventListener("click", showAnswer);

  $("viewModeBtn").addEventListener("click", () => setMode("view"));
  $("typingModeBtn").addEventListener("click", () => setMode("typing"));

  typingInput.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      nextSentence();
    }
  });

  $("inventoryBtn").addEventListener("click", () => showPage("inventory"));
  $("loadBtn").addEventListener("click", () => {
    $("loadStatus").textContent = "";
    showPage("load");
  });

  $("backFromInventoryBtn").addEventListener("click", () => showPage("main"));
  $("backFromLoadBtn").addEventListener("click", () => showPage("main"));

  $("importBtn").addEventListener("click", () => {
    const imported = parseInput($("loadInput").value);

    if (!imported.length) {
      $("loadStatus").textContent = "No valid sentences found.";
      return;
    }

    inventory = inventory.concat(imported);
    saveInventory();
    currentIndex = Math.max(0, inventory.length - imported.length);
    $("loadStatus").textContent = `Imported ${imported.length} sentence(s).`;
    renderStudy();
  });

  $("copyAllBtn").addEventListener("click", async () => {
    const output = inventory.map(item =>
      [
        "[eng]",
        item.eng || "",
        item.deu || "",
        item.esp || "",
        item.fra || "",
        item.sve || ""
      ].join("\n")
    ).join("\n\n");

    try {
      await navigator.clipboard.writeText(output);
      $("copyAllBtn").textContent = "Copied!";
      setTimeout(() => {
        $("copyAllBtn").textContent = "Copy All";
      }, 1500);
    } catch {
      const temporary = document.createElement("textarea");
      temporary.value = output;
      document.body.appendChild(temporary);
      temporary.select();
      document.execCommand("copy");
      temporary.remove();
      $("copyAllBtn").textContent = "Copied!";
      setTimeout(() => {
        $("copyAllBtn").textContent = "Copy All";
      }, 1500);
    }
  });

  loadInventory();
  renderStudy();
})();
</script>
</body>
</html>
