<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✏️Writing Practice</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #fff;
  border-bottom: 1px solid #ddd;
  padding: 10px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  width: 100%;
}

button {
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 14px;
  cursor: pointer;
}

button:hover {
  background: #f0f0f0;
}

button.active {
  background: #222;
  color: #fff;
  border-color: #222;
}

main {
  max-width: 800px;
  margin: 0 auto;
  padding: 30px 16px;
}

.sentence-box {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 28px 20px;
  text-align: center;
  min-height: 180px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 24px;
}

.english {
  font-size: 23px;
  line-height: 1.5;
  cursor: pointer;
}

.answer {
  font-size: 21px;
  line-height: 1.5;
  cursor: pointer;
  display: none;
}

.answer.show {
  display: block;
}

.actions {
  margin-top: 18px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

textarea {
  width: 100%;
  min-height: 400px;
  resize: vertical;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-family: monospace;
  font-size: 15px;
  line-height: 1.5;
}

h1, h2 {
  margin-top: 0;
}

.inventory-item {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
}

.inventory-item pre {
  white-space: pre-wrap;
  word-break: break-word;
  margin: 0 0 12px;
  font-family: Arial, sans-serif;
  line-height: 1.6;
}

.remove-btn {
  color: #b00020;
}

.status {
  margin-top: 12px;
  text-align: center;
  color: #555;
}

.hidden {
  display: none;
}

@media (max-width: 500px) {
  .english {
    font-size: 20px;
  }

  .answer {
    font-size: 19px;
  }

  header button {
    font-size: 13px;
    padding: 7px 10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <button class="lang-btn active" data-lang="esp">🇪🇸 Español</button>
    <button class="lang-btn" data-lang="deu">🇩🇪 Deutsch</button>
    <button class="lang-btn" data-lang="sve">🇸🇪 Svenska</button>
    <button class="lang-btn" data-lang="fra">🇫🇷 Français</button>
  </div>
  <div class="header-row">
    <button id="nextBtn">Next</button>
    <button id="inventoryBtn">Inventory</button>
    <button id="loadBtn">Load</button>
  </div>
</header>

<main>

  <section id="mainPage">
    <div class="sentence-box">
      <div id="englishSentence" class="english"></div>
      <div id="answerSentence" class="answer"></div>
    </div>

    <div class="actions">
      <button id="showAnswerBtn">Show Answer</button>
      <button id="nextBtn2">Next</button>
    </div>

    <div id="mainStatus" class="status"></div>
  </section>

  <section id="loadPage" class="hidden">
    <h2>Load Sentences</h2>

    <textarea id="loadInput" placeholder="[eng]
This one is the same as this.
Das hier ist dasselbe wie das hier.
Esto es lo mismo que esto.
C'est la même chose que ça.
Det här är samma sak som det här.

[eng]
This is the coolest thing I've ever done.
Das ist das Coolste, was ich je gemacht habe.
Esto es lo más genial que he hecho.
C'est la chose la plus cool que j'aie jamais faite.
Det här är det coolaste jag någonsin har gjort."></textarea>

    <div class="actions">
      <button id="saveBtn">Load & Save</button>
      <button id="backFromLoadBtn">Back</button>
    </div>

    <div id="loadStatus" class="status"></div>
  </section>

  <section id="inventoryPage" class="hidden">
    <h2>Inventory</h2>

    <div class="actions" style="justify-content:flex-start;">
      <button id="copyAllBtn">Copy All</button>
      <button id="backFromInventoryBtn">Back</button>
    </div>

    <div id="inventoryList" style="margin-top:18px;"></div>
  </section>

</main>

<script>
const STORAGE_KEY = "sentenceWritingPracticeInventory_v1_7f39c2a8";

const languages = ["eng", "deu", "esp", "fra", "sve"];

const languageNames = {
  eng: "English",
  deu: "Deutsch",
  esp: "Español",
  fra: "Français",
  sve: "Svenska"
};

let inventory = [];
let currentLanguage = "esp";
let currentItem = null;

const mainPage = document.getElementById("mainPage");
const loadPage = document.getElementById("loadPage");
const inventoryPage = document.getElementById("inventoryPage");

const englishSentence = document.getElementById("englishSentence");
const answerSentence = document.getElementById("answerSentence");

const showAnswerBtn = document.getElementById("showAnswerBtn");
const nextBtn = document.getElementById("nextBtn");
const nextBtn2 = document.getElementById("nextBtn2");
const inventoryBtn = document.getElementById("inventoryBtn");
const loadBtn = document.getElementById("loadBtn");

const loadInput = document.getElementById("loadInput");
const saveBtn = document.getElementById("saveBtn");

const inventoryList = document.getElementById("inventoryList");
const copyAllBtn = document.getElementById("copyAllBtn");

const mainStatus = document.getElementById("mainStatus");
const loadStatus = document.getElementById("loadStatus");

function loadStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    inventory = saved ? JSON.parse(saved) : [];
    if (!Array.isArray(inventory)) inventory = [];
  } catch {
    inventory = [];
  }
}

function saveStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
}

function parseInput(text) {
  const lines = text
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(line => line.length > 0);

  const result = [];
  let current = null;

  for (const line of lines) {
    const match = line.match(/^\[([a-zA-Z]+)\]$/);

    if (match) {
      if (current && current.eng) {
        result.push(current);
      }

      current = {
        eng: "",
        deu: "",
        esp: "",
        fra: "",
        sve: ""
      };

      continue;
    }

    if (!current) continue;

    const missingLanguage = languages.find(lang => !current[lang]);

    if (missingLanguage) {
      current[missingLanguage] = line;
    }
  }

  if (current && current.eng) {
    result.push(current);
  }

  return result;
}

function randomItem() {
  if (inventory.length === 0) {
    currentItem = null;
    englishSentence.textContent = "No sentences loaded.";
    answerSentence.textContent = "";
    answerSentence.classList.remove("show");
    return;
  }

  const index = Math.floor(Math.random() * inventory.length);
  currentItem = inventory[index];

  englishSentence.textContent = currentItem.eng;
  answerSentence.textContent = currentItem[currentLanguage] || "(No translation)";
  answerSentence.classList.remove("show");
}

function updateLanguageButtons() {
  document.querySelectorAll(".lang-btn").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.lang === currentLanguage
    );
  });
}

function switchLanguage(lang) {
  currentLanguage = lang;
  updateLanguageButtons();

  if (currentItem) {
    answerSentence.textContent =
      currentItem[currentLanguage] || "(No translation)";
  }
}

function speak(text, lang) {
  if (!text || !("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  const voices = window.speechSynthesis.getVoices();

  const prefixes = {
    eng: ["en-US", "en-GB", "en"],
    deu: ["de-DE", "de"],
    esp: ["es-ES", "es-MX", "es-US", "es"],
    fra: ["fr-FR", "fr-CA", "fr"],
    sve: ["sv-SE", "sv"]
  };

  const preferred = prefixes[lang] || [];

  const voice = voices.find(v =>
    preferred.some(prefix => v.lang === prefix)
  ) || voices.find(v =>
    preferred.some(prefix => v.lang.startsWith(prefix))
  );

  if (voice) {
    utterance.voice = voice;
    utterance.lang = voice.lang;
  }

  window.speechSynthesis.speak(utterance);
}

function showPage(page) {
  mainPage.classList.add("hidden");
  loadPage.classList.add("hidden");
  inventoryPage.classList.add("hidden");

  page.classList.remove("hidden");

  if (page === inventoryPage) {
    renderInventory();
  }
}

function renderInventory() {
  inventoryList.innerHTML = "";

  if (inventory.length === 0) {
    inventoryList.textContent = "No sentences saved.";
    return;
  }

  inventory.forEach((item, index) => {
    const wrapper = document.createElement("div");
    wrapper.className = "inventory-item";

    const pre = document.createElement("pre");

    pre.textContent =
      "[eng]\n" +
      item.eng + "\n" +
      item.deu + "\n" +
      item.esp + "\n" +
      item.fra + "\n" +
      item.sve;

    const removeButton = document.createElement("button");
    removeButton.className = "remove-btn";
    removeButton.textContent = "Remove";

    removeButton.addEventListener("click", () => {
      const confirmed = window.confirm(
        "Are you sure you want to remove this sentence?"
      );

      if (!confirmed) return;

      inventory.splice(index, 1);
      saveStorage();

      if (currentItem === item) {
        currentItem = null;
        randomItem();
      }

      renderInventory();
    });

    wrapper.appendChild(pre);
    wrapper.appendChild(removeButton);

    inventoryList.appendChild(wrapper);
  });
}

function getAllAsText() {
  return inventory.map(item =>
    "[eng]\n" +
    item.eng + "\n" +
    item.deu + "\n" +
    item.esp + "\n" +
    item.fra + "\n" +
    item.sve
  ).join("\n\n");
}

document.querySelectorAll(".lang-btn").forEach(button => {
  button.addEventListener("click", () => {
    switchLanguage(button.dataset.lang);
  });
});

showAnswerBtn.addEventListener("click", () => {
  if (!currentItem) return;

  answerSentence.classList.toggle("show");

  if (answerSentence.classList.contains("show")) {
    answerSentence.textContent =
      currentItem[currentLanguage] || "(No translation)";
  }
});

nextBtn.addEventListener("click", randomItem);
nextBtn2.addEventListener("click", randomItem);

englishSentence.addEventListener("click", () => {
  if (currentItem) speak(currentItem.eng, "eng");
});

answerSentence.addEventListener("click", () => {
  if (currentItem && answerSentence.classList.contains("show")) {
    speak(currentItem[currentLanguage], currentLanguage);
  }
});

inventoryBtn.addEventListener("click", () => {
  showPage(inventoryPage);
});

loadBtn.addEventListener("click", () => {
  loadStatus.textContent = "";
  showPage(loadPage);
});

document.getElementById("backFromLoadBtn").addEventListener("click", () => {
  showPage(mainPage);
});

document.getElementById("backFromInventoryBtn").addEventListener("click", () => {
  showPage(mainPage);
});

saveBtn.addEventListener("click", () => {
  const parsed = parseInput(loadInput.value);

  if (parsed.length === 0) {
    loadStatus.textContent = "No valid sentence sets found.";
    return;
  }

  inventory.push(...parsed);
  saveStorage();

  loadStatus.textContent =
    `${parsed.length} sentence set${parsed.length === 1 ? "" : "s"} loaded.`;

  loadInput.value = "";
});

copyAllBtn.addEventListener("click", async () => {
  const text = getAllAsText();

  if (!text) {
    return;
  }

  try {
    await navigator.clipboard.writeText(text);
    copyAllBtn.textContent = "Copied";
    setTimeout(() => {
      copyAllBtn.textContent = "Copy All";
    }, 1200);
  } catch {
    const temp = document.createElement("textarea");
    temp.value = text;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand("copy");
    temp.remove();

    copyAllBtn.textContent = "Copied";
    setTimeout(() => {
      copyAllBtn.textContent = "Copy All";
    }, 1200);
  }
});

loadStorage();
updateLanguageButtons();
randomItem();
</script>

</body>
</html>
