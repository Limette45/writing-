<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Practice</title>
<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
  color: #222;
}

button, textarea, input {
  font: inherit;
}

button {
  cursor: pointer;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: #f7f7f7;
  padding: 10px 14px;
}

button:hover {
  background: #ececec;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.header {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 24px;
}

.language-button {
  min-width: 68px;
}

.language-button.active {
  background: #dff6ff;
  border-color: #6bb8d6;
  font-weight: bold;
}

#mainPage {
  display: block;
}

#sentenceArea {
  margin-top: 24px;
}

#englishSentence {
  font-size: 1.35rem;
  line-height: 1.6;
  margin-bottom: 20px;
  overflow-wrap: anywhere;
}

#answerArea {
  display: none;
  margin: 18px 0;
  padding: 16px;
  background: #f5f5f5;
  border-radius: 8px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

#showAnswerBtn {
  display: block;
  width: 100%;
  max-width: 340px;
  min-width: 160px;
  min-height: 58px;
  margin: 24px auto 0;
  padding: 14px 24px;
  font-size: 17px;
  font-weight: bold;
  background: #e8f5e9;
  border-color: #a5d6a7;
}

#showAnswerBtn:hover {
  background: #d8eedb;
}

#typingArea {
  display: none;
  margin-top: 20px;
}

#typingInput {
  width: 100%;
  min-height: 130px;
  padding: 12px;
  border: 1px solid #bbb;
  border-radius: 8px;
  resize: vertical;
}

#typingAnswer {
  display: none;
  margin-top: 14px;
  padding: 14px;
  background: #f5f5f5;
  border-radius: 8px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.mode-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 50px;
}

.mode-button {
  min-width: 130px;
}

.mode-button.active {
  background: #dff6ff;
  border-color: #6bb8d6;
  font-weight: bold;
}

#status {
  margin-top: 18px;
  text-align: center;
  color: #666;
  font-size: 0.9rem;
}

.bottom-controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 36px;
  padding-top: 16px;
  border-top: 1px solid #ddd;
}

#inventoryPage,
#loadPage {
  display: none;
}

.page-title {
  font-size: 1.5rem;
  margin-bottom: 20px;
}

.page-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
}

#inventoryList {
  list-style: none;
  padding: 0;
  margin: 0;
}

.inventory-item {
  padding: 14px;
  margin-bottom: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

.inventory-item button {
  margin-top: 10px;
}

#loadInput {
  width: 100%;
  min-height: 250px;
  padding: 12px;
  border: 1px solid #bbb;
  border-radius: 8px;
  resize: vertical;
}

#loadMessage {
  margin-top: 12px;
  white-space: pre-wrap;
}

@media (max-width: 600px) {
  body {
    padding: 14px;
  }

  .header {
    gap: 8px;
  }

  .language-button {
    flex: 1 1 calc(50% - 8px);
  }

  #englishSentence {
    font-size: 1.2rem;
  }

  #showAnswerBtn {
    min-height: 64px;
    min-width: 180px;
    padding: 16px 24px;
    font-size: 18px;
  }

  .mode-controls {
    margin-top: 56px;
    gap: 8px;
  }

  .mode-button {
    flex: 1;
    min-width: 0;
    padding: 12px 8px;
  }

  .bottom-controls {
    margin-top: 36px;
  }
}
</style>
</head>
<body>

<div class="header" id="languageHeader">
  <button class="language-button active" data-lang="esp">🇪🇸 Español</button>
  <button class="language-button" data-lang="deu">🇩🇪 Deutsch</button>
  <button class="language-button" data-lang="fra">🇫🇷 Français</button>
  <button class="language-button" data-lang="sve">🇸🇪 Svenska</button>
</div>

<main id="mainPage">
  <div id="sentenceArea">
    <div id="englishSentence"></div>
    <div id="answerArea"></div>

    <button id="showAnswerBtn">✨ Show Answer</button>
  </div>

  <div id="typingArea">
    <textarea id="typingInput" placeholder="Type your answer here..."></textarea>
    <div id="typingAnswer"></div>
    <div class="page-controls">
      <button id="checkTypingBtn">Show Answer</button>
      <button id="nextTypingBtn">Next</button>
    </div>
  </div>

  <div class="mode-controls">
    <button id="viewModeBtn" class="mode-button active">View Mode</button>
    <button id="typingModeBtn" class="mode-button">Typing Mode</button>
  </div>

  <div id="status"></div>

  <div class="bottom-controls">
    <button id="inventoryBtn">Inventory</button>
    <button id="loadBtn">Load</button>
  </div>
</main>

<section id="inventoryPage">
  <div class="page-title">Inventory</div>
  <div class="page-controls">
    <button id="copyAllBtn">Copy All</button>
    <button id="backFromInventoryBtn">Back</button>
  </div>
  <ul id="inventoryList"></ul>
</section>

<section id="loadPage">
  <div class="page-title">Load Sentences</div>
  <p>Paste your sentences below using the format <code>[eng]</code>, followed by English, German, Spanish, French, and Swedish translations, each on its own line.</p>
  <textarea id="loadInput" placeholder="[eng]&#10;English sentence&#10;German translation&#10;Spanish translation&#10;French translation&#10;Swedish translation"></textarea>
  <div class="page-controls" style="margin-top: 14px;">
    <button id="importBtn">Import</button>
    <button id="backFromLoadBtn">Back</button>
  </div>
  <div id="loadMessage"></div>
</section>

<script>
const STORAGE_KEY = "sentenceWritingPracticeInventory_v1_7f39c2a8";

const LANGUAGES = {
  esp: { index: 2, name: "Spanish", speech: ["es-MX", "es-419", "es-US", "es"] },
  deu: { index: 1, name: "German", speech: ["de-DE", "de"] },
  fra: { index: 3, name: "French", speech: ["fr-FR", "fr"] },
  sve: { index: 4, name: "Swedish", speech: ["sv-SE", "sv"] }
};

let sentences = [];
let currentIndex = 0;
let currentLanguage = "esp";
let currentMode = "view";
let answerVisible = false;
let typingAnswerVisible = false;

const englishSentence = document.getElementById("englishSentence");
const answerArea = document.getElementById("answerArea");
const showAnswerBtn = document.getElementById("showAnswerBtn");
const typingArea = document.getElementById("typingArea");
const typingInput = document.getElementById("typingInput");
const typingAnswer = document.getElementById("typingAnswer");
const status = document.getElementById("status");

const mainPage = document.getElementById("mainPage");
const inventoryPage = document.getElementById("inventoryPage");
const loadPage = document.getElementById("loadPage");

function loadInventory() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    sentences = saved ? JSON.parse(saved) : [];
    if (!Array.isArray(sentences)) sentences = [];
  } catch {
    sentences = [];
  }
}

function saveInventory() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sentences));
}

function normalizeSentence(item) {
  const result = {
    eng: String(item.eng || "").trim(),
    deu: String(item.deu || "").trim(),
    esp: String(item.esp || "").trim(),
    fra: String(item.fra || "").trim(),
    sve: String(item.sve || "").trim()
  };
  return result;
}

function getCurrentSentence() {
  return sentences[currentIndex] || null;
}

function getTranslation(sentence) {
  if (!sentence) return "";
  return sentence[currentLanguage] || "";
}

function updateStatus() {
  if (sentences.length === 0) {
    status.textContent = "No sentences loaded.";
  } else {
    status.textContent = `${currentIndex + 1} / ${sentences.length}`;
  }
}

function stopSpeech() {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
}

function speak(text, lang) {
  if (!("speechSynthesis" in window) || !text) return;

  stopSpeech();

  const utterance = new SpeechSynthesisUtterance(text);
  const preferences = LANGUAGES[lang]?.speech || [];

  const voices = window.speechSynthesis.getVoices();
  let selectedVoice = null;

  for (const preferred of preferences) {
    selectedVoice = voices.find(voice =>
      voice.lang.toLowerCase() === preferred.toLowerCase()
    );
    if (selectedVoice) break;
  }

  if (!selectedVoice && preferences.length > 0) {
    const prefix = preferences[preferences.length - 1].split("-")[0].toLowerCase();
    selectedVoice = voices.find(voice =>
      voice.lang.toLowerCase().startsWith(prefix)
    );
  }

  if (selectedVoice) {
    utterance.voice = selectedVoice;
    utterance.lang = selectedVoice.lang;
  } else if (preferences.length > 0) {
    utterance.lang = preferences[0];
  }

  window.speechSynthesis.speak(utterance);
}

function renderSentence() {
  const sentence = getCurrentSentence();

  answerVisible = false;
  typingAnswerVisible = false;
  answerArea.style.display = "none";
  typingAnswer.style.display = "none";
  typingInput.value = "";

  if (!sentence) {
    englishSentence.textContent = "Load sentences to begin.";
    answerArea.textContent = "";
    showAnswerBtn.textContent = "✨ Show Answer";
    showAnswerBtn.disabled = true;
    typingInput.disabled = true;
    updateStatus();
    return;
  }

  showAnswerBtn.disabled = false;
  typingInput.disabled = false;

  englishSentence.textContent = sentence.eng;
  answerArea.textContent = getTranslation(sentence);
  typingAnswer.textContent = getTranslation(sentence);
  showAnswerBtn.textContent = "✨ Show Answer";

  updateStatus();
}

function nextSentence() {
  if (sentences.length === 0) return;

  currentIndex = (currentIndex + 1) % sentences.length;
  renderSentence();

  if (currentMode === "view") {
    revealAnswer();
  }
}

function revealAnswer() {
  const sentence = getCurrentSentence();
  if (!sentence) return;

  answerVisible = true;
  answerArea.style.display = "block";
  answerArea.textContent = getTranslation(sentence);
  showAnswerBtn.textContent = "✨ Next";

  speak(getTranslation(sentence), currentLanguage);
}

function showAnswerOrNext() {
  if (!getCurrentSentence()) return;

  if (!answerVisible) {
    revealAnswer();
  } else {
    nextSentence();
  }
}

function setLanguage(lang) {
  if (!LANGUAGES[lang]) return;

  currentLanguage = lang;

  document.querySelectorAll(".language-button").forEach(button => {
    button.classList.toggle("active", button.dataset.lang === lang);
  });

  renderSentence();
}

function setMode(mode) {
  currentMode = mode;
  stopSpeech();

  const isView = mode === "view";

  document.getElementById("viewModeBtn").classList.toggle("active", isView);
  document.getElementById("typingModeBtn").classList.toggle("active", !isView);

  document.getElementById("sentenceArea").style.display = isView ? "block" : "none";
  typingArea.style.display = isView ? "none" : "block";

  renderSentence();
}

function showTypingAnswer() {
  const sentence = getCurrentSentence();
  if (!sentence) return;

  typingAnswerVisible = !typingAnswerVisible;
  typingAnswer.style.display = typingAnswerVisible ? "block" : "none";
  document.getElementById("checkTypingBtn").textContent =
    typingAnswerVisible ? "Hide Answer" : "Show Answer";
}

function nextTypingSentence() {
  nextSentence();
  typingInput.focus();
}

function showPage(page) {
  stopSpeech();

  mainPage.style.display = page === "main" ? "block" : "none";
  inventoryPage.style.display = page === "inventory" ? "block" : "none";
  loadPage.style.display = page === "load" ? "block" : "none";

  if (page === "inventory") renderInventory();
}

function renderInventory() {
  const list = document.getElementById("inventoryList");
  list.innerHTML = "";

  if (sentences.length === 0) {
    const empty = document.createElement("li");
    empty.textContent = "Inventory is empty.";
    list.appendChild(empty);
    return;
  }

  sentences.forEach((sentence, index) => {
    const item = document.createElement("li");
    item.className = "inventory-item";

    const text = document.createElement("div");
    text.textContent = `${index + 1}. ${sentence.eng}`;
    item.appendChild(text);

    const translation = document.createElement("div");
    translation.style.marginTop = "6px";
    translation.style.color = "#555";
    translation.textContent = sentence.esp;
    item.appendChild(translation);

    const removeButton = document.createElement("button");
    removeButton.textContent = "Remove";
    removeButton.addEventListener("click", () => {
      sentences.splice(index, 1);
      if (currentIndex >= sentences.length) {
        currentIndex = Math.max(0, sentences.length - 1);
      }
      saveInventory();
      renderInventory();
      renderSentence();
    });

    item.appendChild(removeButton);
    list.appendChild(item);
  });
}

function copyAllSentences() {
  const text = sentences.map(sentence =>
    `[eng]\n${sentence.eng}\n${sentence.deu}\n${sentence.esp}\n${sentence.fra}\n${sentence.sve}`
  ).join("\n\n");

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text);
  } else {
    const temporary = document.createElement("textarea");
    temporary.value = text;
    document.body.appendChild(temporary);
    temporary.select();
    document.execCommand("copy");
    temporary.remove();
  }
}

function parseImport(text) {
  const blocks = text.split(/(?=^\s*\[eng\]\s*$)/mi);
  const parsed = [];

  for (const block of blocks) {
    const trimmed = block.trim();
    if (!trimmed) continue;

    const lines = trimmed.split(/\r?\n/).map(line => line.trim());
    if (lines[0].toLowerCase() !== "[eng]") continue;

    const values = lines.slice(1);
    if (values.length < 1 || !values[0]) continue;

    parsed.push(normalizeSentence({
      eng: values[0],
      deu: values[1] || "",
      esp: values[2] || "",
      fra: values[3] || "",
      sve: values[4] || ""
    }));
  }

  return parsed;
}

document.querySelectorAll(".language-button").forEach(button => {
  button.addEventListener("click", () => setLanguage(button.dataset.lang));
});

showAnswerBtn.addEventListener("click", showAnswerOrNext);

document.getElementById("viewModeBtn").addEventListener("click", () => {
  setMode("view");
});

document.getElementById("typingModeBtn").addEventListener("click", () => {
  setMode("typing");
});

document.getElementById("checkTypingBtn").addEventListener("click", showTypingAnswer);
document.getElementById("nextTypingBtn").addEventListener("click", nextTypingSentence);

typingInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    nextTypingSentence();
  }
});

document.getElementById("inventoryBtn").addEventListener("click", () => {
  showPage("inventory");
});

document.getElementById("loadBtn").addEventListener("click", () => {
  document.getElementById("loadInput").value = "";
  document.getElementById("loadMessage").textContent = "";
  showPage("load");
});

document.getElementById("backFromInventoryBtn").addEventListener("click", () => {
  showPage("main");
});

document.getElementById("backFromLoadBtn").addEventListener("click", () => {
  showPage("main");
});

document.getElementById("copyAllBtn").addEventListener("click", copyAllSentences);

document.getElementById("importBtn").addEventListener("click", () => {
  const input = document.getElementById("loadInput").value;
  const imported = parseImport(input);
  const message = document.getElementById("loadMessage");

  if (imported.length === 0) {
    message.textContent = "No valid sentences found. Check the format and try again.";
    return;
  }

  sentences.push(...imported);
  saveInventory();
  currentIndex = Math.max(0, sentences.length - imported.length);
  message.textContent = `Imported ${imported.length} sentence(s).`;
  renderSentence();
});

loadInventory();
renderSentence();

if ("speechSynthesis" in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.addEventListener("voiceschanged", () => {});
}
</script>
</body>
</html>
