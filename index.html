<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Practice</title>
<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 16px;
  background: #f5f5f5;
  color: #222;
}

.container {
  max-width: 760px;
  margin: 0 auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
}

header {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}

button {
  cursor: pointer;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 10px 14px;
  background: #f7f7f7;
  color: #222;
  font-size: 15px;
}

button:hover {
  background: #eaeaea;
}

button.active {
  background: #dff6ff;
  border-color: #6bbbd5;
}

.language-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  width: 100%;
}

.language-buttons button {
  flex: 1;
  min-width: 100px;
}

#mainPage,
#inventoryPage,
#loadPage {
  display: none;
}

#mainPage.active,
#inventoryPage.active,
#loadPage.active {
  display: block;
}

.english {
  font-size: 22px;
  line-height: 1.5;
  margin: 24px 0;
  overflow-wrap: anywhere;
}

.answer {
  font-size: 20px;
  line-height: 1.6;
  margin: 20px 0;
  padding: 14px;
  background: #f0f8ff;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

textarea {
  width: 100%;
  min-height: 120px;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 18px;
  resize: vertical;
}

.main-actions {
  margin-top: 20px;
}

#showAnswerBtn {
  min-height: 58px;
  padding: 14px 24px;
  min-width: 160px;
  font-size: 17px;
  font-weight: bold;
}

.mode-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 50px;
  flex-wrap: wrap;
}

.mode-controls button {
  min-width: 130px;
}

.bottom-controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 36px;
  padding-top: 16px;
  border-top: 1px solid #ddd;
}

.status {
  color: #666;
  margin-top: 12px;
  font-size: 14px;
}

.inventory-item {
  border: 1px solid #ddd;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 10px;
  overflow-wrap: anywhere;
}

.inventory-item button {
  margin-top: 8px;
}

.page-title {
  font-size: 22px;
  margin-bottom: 16px;
}

textarea#importText {
  min-height: 220px;
}

.page-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

@media (max-width: 480px) {
  body {
    padding: 8px;
  }

  .container {
    padding: 14px;
  }

  .english {
    font-size: 20px;
  }

  .answer {
    font-size: 18px;
  }

  #showAnswerBtn {
    min-height: 64px;
    min-width: 180px;
    padding: 16px 24px;
    font-size: 18px;
  }

  .mode-controls {
    margin-top: 56px;
  }

  .mode-controls button {
    flex: 1;
  }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="language-buttons">
      <button class="active" data-lang="esp">🇪🇸 Español</button>
      <button data-lang="deu">🇩🇪 Deutsch</button>
      <button data-lang="sve">🇸🇪 Svenska</button>
      <button data-lang="fra">🇫🇷 Français</button>
    </div>
  </header>

  <section id="mainPage" class="active">
    <div id="englishText" class="english"></div>

    <div id="typingArea" style="display:none;">
      <textarea id="userInput" placeholder="Type your sentence here..."></textarea>
    </div>

    <div id="answerArea" class="answer" style="display:none;"></div>

    <div class="main-actions">
      <button id="showAnswerBtn">✨ Show Answer</button>
    </div>

    <div class="mode-controls">
      <button id="viewModeBtn" class="active">View Mode</button>
      <button id="typingModeBtn">Typing Mode</button>
    </div>

    <div id="status" class="status"></div>

    <div class="bottom-controls">
      <button id="inventoryBtn">Inventory</button>
      <button id="loadBtn">Load</button>
    </div>
  </section>

  <section id="inventoryPage">
    <div class="page-title">Inventory</div>
    <div id="inventoryList"></div>
    <div class="page-actions">
      <button id="copyAllBtn">Copy All</button>
      <button id="backFromInventoryBtn">Back</button>
    </div>
  </section>

  <section id="loadPage">
    <div class="page-title">Load Sentences</div>
    <p>Paste your sentences below.</p>
    <textarea id="importText" placeholder="[eng]
English sentence
German translation
Spanish translation
French translation
Swedish translation"></textarea>
    <div class="page-actions">
      <button id="importBtn">Load Sentences</button>
      <button id="backFromLoadBtn">Back</button>
    </div>
    <div id="loadStatus" class="status"></div>
  </section>
</div>

<script>
const STORAGE_KEY = "sentenceWritingPracticeInventory_v1_7f39c2a8";

const languageNames = {
  esp: "Spanish",
  deu: "German",
  sve: "Swedish",
  fra: "French"
};

const languageVoices = {
  esp: ["es-MX", "es-419", "es-US", "es"],
  deu: ["de-DE", "de"],
  sve: ["sv-SE", "sv"],
  fra: ["fr-FR", "fr"]
};

let inventory = [];
let currentIndex = 0;
let currentLanguage = "esp";
let mode = "view";
let answerVisible = false;

const englishText = document.getElementById("englishText");
const typingArea = document.getElementById("typingArea");
const userInput = document.getElementById("userInput");
const answerArea = document.getElementById("answerArea");
const showAnswerBtn = document.getElementById("showAnswerBtn");
const status = document.getElementById("status");

function loadInventory() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    inventory = stored ? JSON.parse(stored) : [];
  } catch {
    inventory = [];
  }
}

function saveInventory() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
}

function currentSentence() {
  return inventory[currentIndex];
}

function getTranslation(sentence, lang) {
  if (!sentence) return "";
  return sentence[lang] || "";
}

function render() {
  const sentence = currentSentence();

  if (!sentence) {
    englishText.textContent = "No sentences loaded. Use Load to add sentences.";
    typingArea.style.display = "none";
    answerArea.style.display = "none";
    showAnswerBtn.style.display = "none";
    status.textContent = "0 sentences";
    return;
  }

  showAnswerBtn.style.display = "inline-block";
  englishText.textContent = sentence.eng || "";
  status.textContent = `${currentIndex + 1} / ${inventory.length}`;

  if (mode === "view") {
    typingArea.style.display = "none";
    answerArea.style.display = answerVisible ? "block" : "none";
    answerArea.textContent = answerVisible
      ? getTranslation(sentence, currentLanguage)
      : "";
    showAnswerBtn.textContent = answerVisible ? "✨ Next" : "✨ Show Answer";
  } else {
    typingArea.style.display = "block";
    answerArea.style.display = answerVisible ? "block" : "none";
    answerArea.textContent = answerVisible
      ? getTranslation(sentence, currentLanguage)
      : "";
    showAnswerBtn.textContent = answerVisible ? "✨ Next" : "✨ Show Answer";
  }
}

function speak(text, lang) {
  if (!text || !("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  const preferred = languageVoices[lang] || [];
  const voices = speechSynthesis.getVoices();

  let voice = null;
  for (const prefix of preferred) {
    voice = voices.find(v => v.lang.toLowerCase() === prefix.toLowerCase());
    if (voice) break;
    voice = voices.find(v => v.lang.toLowerCase().startsWith(prefix.toLowerCase()));
    if (voice) break;
  }

  if (voice) {
    utterance.voice = voice;
    utterance.lang = voice.lang;
  } else if (preferred.length) {
    utterance.lang = preferred[0];
  }

  speechSynthesis.speak(utterance);
}

function showAnswer() {
  const sentence = currentSentence();
  if (!sentence) return;

  if (!answerVisible) {
    answerVisible = true;
    render();

    if (mode === "view") {
      speak(getTranslation(sentence, currentLanguage), currentLanguage);
    }
  } else {
    nextSentence();
  }
}

function nextSentence() {
  if (!inventory.length) return;

  currentIndex = (currentIndex + 1) % inventory.length;
  answerVisible = false;
  userInput.value = "";
  render();
}

function setMode(nextMode) {
  mode = nextMode;
  answerVisible = false;

  document.getElementById("viewModeBtn").classList.toggle("active", mode === "view");
  document.getElementById("typingModeBtn").classList.toggle("active", mode === "typing");

  userInput.value = "";
  render();
}

function showPage(pageId) {
  document.querySelectorAll("#mainPage, #inventoryPage, #loadPage").forEach(page => {
    page.classList.toggle("active", page.id === pageId);
  });

  if (pageId === "inventoryPage") renderInventory();
}

function renderInventory() {
  const list = document.getElementById("inventoryList");
  list.innerHTML = "";

  if (!inventory.length) {
    list.textContent = "Inventory is empty.";
    return;
  }

  inventory.forEach((sentence, index) => {
    const item = document.createElement("div");
    item.className = "inventory-item";

    const text = document.createElement("div");
    text.textContent = `${index + 1}. ${sentence.eng || ""}`;
    item.appendChild(text);

    const details = document.createElement("div");
    details.style.color = "#666";
    details.style.marginTop = "6px";
    details.textContent = [
      sentence.deu || "",
      sentence.esp || "",
      sentence.fra || "",
      sentence.sve || ""
    ].filter(Boolean).join(" | ");
    item.appendChild(details);

    const removeBtn = document.createElement("button");
    removeBtn.textContent = "Remove";
    removeBtn.addEventListener("click", () => {
      inventory.splice(index, 1);
      if (currentIndex >= inventory.length) {
        currentIndex = Math.max(0, inventory.length - 1);
      }
      saveInventory();
      renderInventory();
      render();
    });
    item.appendChild(removeBtn);

    list.appendChild(item);
  });
}

function parseImport(text) {
  const blocks = text.split(/^\[eng\]\s*$/gim).slice(1);
  const parsed = [];

  for (const block of blocks) {
    const lines = block.trim().split(/\r?\n/).map(line => line.trim()).filter(Boolean);
    if (!lines.length) continue;

    parsed.push({
      eng: lines[0] || "",
      deu: lines[1] || "",
      esp: lines[2] || "",
      fra: lines[3] || "",
      sve: lines[4] || ""
    });
  }

  return parsed;
}

document.querySelectorAll("[data-lang]").forEach(button => {
  button.addEventListener("click", () => {
    currentLanguage = button.dataset.lang;

    document.querySelectorAll("[data-lang]").forEach(btn => {
      btn.classList.toggle("active", btn === button);
    });

    answerVisible = false;
    render();
  });
});

showAnswerBtn.addEventListener("click", showAnswer);

document.getElementById("viewModeBtn").addEventListener("click", () => {
  setMode("view");
});

document.getElementById("typingModeBtn").addEventListener("click", () => {
  setMode("typing");
});

userInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    nextSentence();
  }
});

document.getElementById("inventoryBtn").addEventListener("click", () => {
  showPage("inventoryPage");
});

document.getElementById("loadBtn").addEventListener("click", () => {
  showPage("loadPage");
});

document.getElementById("backFromInventoryBtn").addEventListener("click", () => {
  showPage("mainPage");
});

document.getElementById("backFromLoadBtn").addEventListener("click", () => {
  showPage("mainPage");
});

document.getElementById("importBtn").addEventListener("click", () => {
  const parsed = parseImport(document.getElementById("importText").value);
  if (!parsed.length) {
    document.getElementById("loadStatus").textContent = "No valid sentences found.";
    return;
  }

  inventory.push(...parsed);
  saveInventory();
  currentIndex = Math.max(0, inventory.length - parsed.length);
  answerVisible = false;

  document.getElementById("loadStatus").textContent = `${parsed.length} sentences loaded.`;
  showPage("mainPage");
  render();
});

document.getElementById("copyAllBtn").addEventListener("click", async () => {
  const text = inventory.map(sentence =>
    [
      "[eng]",
      sentence.eng || "",
      sentence.deu || "",
      sentence.esp || "",
      sentence.fra || "",
      sentence.sve || ""
    ].join("\n")
  ).join("\n\n");

  try {
    await navigator.clipboard.writeText(text);
    document.getElementById("copyAllBtn").textContent = "Copied!";
    setTimeout(() => {
      document.getElementById("copyAllBtn").textContent = "Copy All";
    }, 1500);
  } catch {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    textarea.remove();
  }
});

loadInventory();
render();
</script>
</body>
</html>
